<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }

      /* Animated flow pulses */
      @keyframes flowPulse {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes orbPulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.12); }
      }

      .pulse-flow-1 {
        stroke-dasharray: 12, 12;
        animation: flowPulse 20s linear infinite;
      }
      .pulse-flow-2 {
        stroke-dasharray: 8, 16;
        animation: flowPulse 15s linear infinite reverse;
      }
      .card-float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .card-float-2 {
        animation: floatFast 7s ease-in-out infinite;
      }
      .bg-orb {
        animation: orbPulse 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Dynamic Ambient Orbs -->
  <g class="bg-orb">
    <circle cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
    <circle cx="950" cy="90" r="100" fill="#ec4899" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Dynamic Animated Circuit/Data Pipelines in Background -->
  <g opacity="0.45">
    <path class="pulse-flow-1" d="M 50 80 Q 300 20, 600 80 T 1150 80" fill="none" stroke="url(#glowLine)" stroke-width="2" />
    <path class="pulse-flow-2" d="M 80 340 Q 350 390, 650 330 T 1120 350" fill="none" stroke="url(#glowLine)" stroke-width="2" />
    <path class="pulse-flow-1" d="M 120 180 C 400 260, 800 120, 1080 200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6, 12" />
  </g>

  <!-- Interactive Ecosystem Connectivity Nodes (Floating cards in background/corners) -->
  <!-- Top Left Pill Card -->
  <g class="card-float-1" transform="translate(70, 45)" filter="url(#nodeShadow)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#38bdf8" filter="url(#glow)" />
    <text x="42" y="26" class="tag-text" fill="#e2e8f0">⚡ Event Webhooks</text>
  </g>

  <!-- Bottom Left Pill Card -->
  <g class="card-float-2" transform="translate(60, 320)" filter="url(#nodeShadow)">
    <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#818cf8" filter="url(#glow)" />
    <text x="42" y="26" class="tag-text" fill="#e2e8f0">🔄 Enterprise iPaaS / ETL</text>
  </g>

  <!-- Top Right Pill Card -->
  <g class="card-float-2" transform="translate(930, 45)" filter="url(#nodeShadow)">
    <rect width="200" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#c084fc" filter="url(#glow)" />
    <text x="42" y="26" class="tag-text" fill="#e2e8f0">🤖 AI Agents &amp; MCP Sync</text>
  </g>

  <!-- Bottom Right Pill Card -->
  <g class="card-float-1" transform="translate(920, 320)" filter="url(#nodeShadow)">
    <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#34d399" filter="url(#glow)" />
    <text x="42" y="26" class="tag-text" fill="#e2e8f0">🚀 100% Open-Source Stacks</text>
  </g>

  <!-- Foreground Title and Branding Content (Clear and unhidden) -->
  <g text-anchor="middle" transform="translate(600, 165)">
    <!-- Badge -->
    <rect x="-160" y="-35" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="-14" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">INTEGRATION PLATFORM ECOSYSTEM</text>
    
    <!-- Main Title -->
    <text x="0" y="42" class="title" fill="url(#textGrad)">Awesome Third-Party Integration Framework</text>
    
    <!-- Subtitle -->
    <text x="0" y="86" class="subtitle">The definitive guide to Enterprise iPaaS, Workflow Engines, and Open-Source Integration Stacks</text>

    <!-- Metrics / Feature Pills in Foreground -->
    <g transform="translate(0, 115)">
      <rect x="-240" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-167" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Enterprise iPaaS</text>

      <rect x="-80" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="0" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Open-Source Engines</text>

      <rect x="95" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="167" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">AI Agent Orchestration</text>
    </g>
  </g>
</svg>
